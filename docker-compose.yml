services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - video-data:/tmp/video-summarizer
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  video-data:
