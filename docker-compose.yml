services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - video-data:/tmp/video-summarizer
      # Mount cookies file for YouTube auth (create backend/cookies.txt from browser export)
      # Comment out this line if you don't have a cookies file yet
      # - ./backend/cookies.txt:/app/cookies.txt:ro
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/video_summarizer
      - YOUTUBE_COOKIES_PATH=/app/cookies.txt
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3008:80"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=video_summarizer
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  video-data:
  postgres-data:
